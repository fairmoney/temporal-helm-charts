{{- if and .Values.web.enabled .Values.web.httpRoute.enabled -}}
{{- if not .Values.web.httpRoute.parentRefs }}{{ fail "web.httpRoute.parentRefs is required when web.httpRoute.enabled" }}{{ end -}}
{{- if not .Values.web.httpRoute.hostnames }}{{ fail "web.httpRoute.hostnames is required when web.httpRoute.enabled" }}{{ end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "temporal.componentname" (list $ "web") }}
  labels:
    {{- include "temporal.resourceLabels" (list $ "web" "") | nindent 4 }}
  {{- with .Values.web.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.web.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.web.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.web.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "temporal.componentname" (list $ "web") }}
          port: {{ .Values.web.service.port }}
{{- end }}
